<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پازل کلمات هم‌معنی | آموزگار - صادقی</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
min-height:100%;
}

body{

font-family:
Tahoma,
Arial,
sans-serif;

color:#43506a;

background:

radial-gradient(
circle at 10% 15%,
rgba(255,180,205,.42),
transparent 25%
),

radial-gradient(
circle at 90% 15%,
rgba(160,220,255,.42),
transparent 25%
),

radial-gradient(
circle at 15% 90%,
rgba(190,245,205,.42),
transparent 25%
),

radial-gradient(
circle at 90% 90%,
rgba(215,190,255,.42),
transparent 25%
),

linear-gradient(
135deg,
#fffaff,
#f4fbff,
#fffaff
);

min-height:100vh;

overflow-x:hidden;

}

/* رنگین کمان */

body::before{

content:"";

position:fixed;

width:900px;
height:230px;

left:50%;
top:-130px;

transform:translateX(-50%);

border-radius:50%;

border:18px solid rgba(255,120,150,.11);

box-shadow:

0 0 0 18px rgba(255,195,90,.10),

0 0 0 36px rgba(120,225,150,.10),

0 0 0 54px rgba(100,195,255,.10),

0 0 0 72px rgba(185,135,255,.10);

pointer-events:none;

}

/* صفحه شروع */

.start-screen{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}

.start-card{

width:min(560px,100%);

padding:34px 25px;

text-align:center;

border-radius:35px;

background:
rgba(255,255,255,.86);

backdrop-filter:blur(18px);

border:
2px solid
rgba(255,255,255,.95);

box-shadow:

0 25px 70px
rgba(90,90,150,.15),

inset 0 0 30px
rgba(255,255,255,.8);

}

.puzzle-icon{

font-size:78px;

animation:
float 2.5s ease-in-out infinite;

}

.title{

font-size:32px;

font-weight:900;

color:#6d5bd0;

margin:8px 0;

}

.teacher{

direction:rtl;

font-size:20px;

font-weight:900;

color:#dc7399;

margin:10px 0 18px;

}

.description{

font-size:16px;

line-height:2;

color:#596579;

margin-bottom:18px;

}

.name-input{

width:100%;

height:58px;

border:

2px solid
#d9cdf9;

border-radius:18px;

background:#fff;

outline:none;

font-family:Tahoma;

font-size:18px;

text-align:center;

color:#4b5563;

padding:0 15px;

}

.name-input:focus{

border-color:#a78bfa;

box-shadow:

0 0 0 4px
rgba(167,139,250,.12);

}

.start-btn{

width:100%;

height:60px;

margin-top:16px;

border:0;

border-radius:20px;

font-family:Tahoma;

font-size:19px;

font-weight:900;

color:white;

cursor:pointer;

background:

linear-gradient(
90deg,
#ff9db7,
#ffd17d,
#9fe3ae,
#8ddaff,
#b99aff
);

box-shadow:

0 7px 0
rgba(100,85,160,.25),

0 12px 30px
rgba(120,110,200,.2);

transition:.18s;

}

.start-btn:active{

transform:translateY(5px);

box-shadow:
0 2px 0
rgba(100,85,160,.25);

}

/* بازی */

.game{

display:none;

width:min(650px,100%);

margin:auto;

padding:15px;

}

.header{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

padding:14px 16px;

border-radius:23px;

background:
rgba(255,255,255,.85);

box-shadow:
0 10px 30px
rgba(80,80,140,.10);

margin-bottom:12px;

}

.game-title{

font-size:20px;

font-weight:900;

color:#6758bf;

}

.designer{

font-size:13px;

font-weight:bold;

color:#dc7399;

margin-top:3px;

}

.info{

display:flex;

gap:7px;

}

.badge{

padding:8px 11px;

border-radius:15px;

background:white;

font-size:13px;

font-weight:bold;

box-shadow:
0 4px 12px
rgba(80,80,130,.08);

}

.score{

color:#d99c24;

}

/* توضیح */

.hint{

text-align:center;

font-size:15px;

font-weight:bold;

color:#64748b;

margin:10px 0 15px;

}

/* پازل */

.puzzle-container{

width:100%;

display:flex;

justify-content:center;

}

.puzzle{

width:min(620px,100%);

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:10px;

padding:10px;

border-radius:28px;

background:

linear-gradient(
135deg,
rgba(255,170,195,.15),
rgba(255,215,140,.15),
rgba(160,235,185,.15),
rgba(145,210,255,.15),
rgba(195,165,255,.15)
);

box-shadow:

0 20px 55px
rgba(80,90,140,.12),

inset 0 0 30px
rgba(255,255,255,.8);

}

/* کارت */

.tile{

aspect-ratio:1/1;

perspective:900px;

cursor:pointer;

}

.tile-inner{

width:100%;

height:100%;

position:relative;

transform-style:preserve-3d;

transition:

transform .55s
cubic-bezier(.2,.8,.2,1);

}

.tile.flipped
.tile-inner{

transform:
rotateY(180deg);

}

.tile-front,
.tile-back{

position:absolute;

inset:0;

backface-visibility:hidden;

-webkit-backface-visibility:hidden;

border-radius:19px;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

}

/* پشت قطعه */

.tile-front{

background:

linear-gradient(
135deg,
#ffb5ca,
#ffd99a,
#bcecc8,
#a7dcff,
#c7b1ff
);

border:
2px solid
rgba(255,255,255,.9);

box-shadow:

0 7px 15px
rgba(80,80,130,.13),

inset 0 0 15px
rgba(255,255,255,.65);

}

.tile-front::before{

content:"🧩";

font-size:35px;

filter:
drop-shadow(
0 3px 4px
rgba(80,70,120,.2)
);

}

/* کلمه */

.tile-back{

transform:
rotateY(180deg);

background:
rgba(255,255,255,.97);

border:
3px solid
#ddd4f5;

padding:8px;

font-size:
clamp(17px,4vw,28px);

font-weight:900;

color:#536078;

box-shadow:

0 7px 18px
rgba(70,80,130,.12),

inset 0 0 15px
rgba(255,255,255,.8);

}

/* رنگ کلمات */

.tile:nth-child(4n+1)
.tile-back{

border-color:#ffb4c9;

color:#c25d7e;

}

.tile:nth-child(4n+2)
.tile-back{

border-color:#ffd58b;

color:#bd8a28;

}

.tile:nth-child(4n+3)
.tile-back{

border-color:#a9e5b9;

color:#4c9763;

}

.tile:nth-child(4n)
.tile-back{

border-color:#a4d9ff;

color:#4b8db9;

}

/* جفت پیدا شده */

.tile.matched
.tile-back{

background:

linear-gradient(
135deg,
#effff4,
#ffffff,
#f7efff
);

border:
3px solid
#76d89b;

box-shadow:

0 0 25px
rgba(88,220,135,.35);

}

.tile.matched
.tile-inner{

animation:
matched .55s ease;

}

/* پیام */

.message{

min-height:55px;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

font-size:17px;

font-weight:900;

color:#667085;

padding:8px;

}

/* پایان */

.end-screen{

display:none;

position:fixed;

inset:0;

z-index:100;

align-items:center;

justify-content:center;

padding:20px;

background:
rgba(249,250,255,.94);

backdrop-filter:blur(15px);

}

.end-card{

width:min(520px,100%);

padding:38px 25px;

text-align:center;

border-radius:35px;

background:white;

box-shadow:
0 25px 80px
rgba(80,70,150,.20);

}

.trophy{

font-size:85px;

animation:
bounce 1.2s infinite;

}

.end-card h2{

font-size:30px;

color:#6d5bd0;

}

.final-name{

font-size:18px;

color:#df779b;

font-weight:bold;

}

.final-score{

font-size:26px;

font-weight:900;

color:#d99c24;

margin:15px;

}

.final-message{

font-size:17px;

line-height:2;

color:#64748b;

margin-bottom:22px;

}

.restart{

width:100%;

height:57px;

border:0;

border-radius:19px;

font-family:Tahoma;

font-size:18px;

font-weight:900;

color:white;

background:

linear-gradient(
90deg,
#ff9db7,
#ffd07b,
#9fe3ad,
#8ed9ff,
#ba9bff
);

cursor:pointer;

}

/* انیمیشن */

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-12px);
}

}

@keyframes matched{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-14px);
}

}

/* موبایل */

@media(max-width:600px){

.game{

padding:8px;

}

.header{

flex-direction:column;

}

.game-title{

font-size:18px;

}

.puzzle{

gap:6px;

padding:6px;

}

.tile-front,
.tile-back{

border-radius:13px;

}

.tile-front::before{

font-size:25px;

}

.tile-back{

font-size:
clamp(14px,4vw,21px);

}

.hint{

font-size:13px;

}

}

</style>

</head>

<body>


<!-- =======================
     صفحه شروع
======================= -->

<div
class="start-screen"
id="startScreen"
>

<div class="start-card">

<div class="puzzle-icon">
🧩
</div>

<div class="title">
پازل کلمات هم‌معنی
</div>

<div class="teacher">
آموزگار - صادقی
</div>

<div class="description">

کارت‌ها را برگردان و
<br>

هر کلمه را با
<strong>
هم‌معنی خودش
</strong>
پیدا کن. 🌈

</div>

<input
id="nameInput"
class="name-input"
type="text"
maxlength="25"
placeholder="نام دانش‌آموز را بنویس..."
>

<button
id="startButton"
class="start-btn"
>

🧩 شروع بازی

</button>

</div>

</div>



<!-- =======================
     صفحه بازی
======================= -->

<div
class="game"
id="game"
>

<div class="header">

<div>

<div class="game-title">
🌈 پازل هم‌معنی‌ها
</div>

<div class="designer">
آموزگار - صادقی
</div>

</div>

<div class="info">

<div class="badge score">

⭐ امتیاز:

<span id="score">
۰
</span>

</div>

<div class="badge">

🔄 حرکت:

<span id="moves">
۰
</span>

</div>

</div>

</div>


<div class="hint">

🧩 روی دو قطعه ضربه بزن و
<strong>
کلمات هم‌معنی
</strong>
را پیدا کن.

</div>


<div class="puzzle-container">

<div
class="puzzle"
id="puzzle"
>
</div>

</div>


<div
class="message"
id="message"
>

🌟 اولین قطعه را انتخاب کن!

</div>

</div>



<!-- =======================
     صفحه پایان
======================= -->

<div
class="end-screen"
id="endScreen"
>

<div class="end-card">

<div class="trophy">
🏆
</div>

<h2>
آفرین! 🎉
</h2>

<div
class="final-name"
id="finalName"
>
</div>

<div class="final-score">

امتیاز:

<span id="finalScore">
۰
</span>

</div>

<div
class="final-message"
id="finalMessage"
>
</div>

<button
class="restart"
onclick="restartGame()"
>

🔄 دوباره بازی کن

</button>

</div>

</div>



<script>

/* ==================================
   کلمات داده شده توسط آموزگار
================================== */

const wordPairs = [

["ملایم","آرام"],

["مفید","بافایده"],

["گفت و گو","مشورت"],

["ویژه","مخصوص"],

["پرسش","سؤال"],

["پیشنهاد","نظر"],

["نظم","ترتیب"],

["اندیشه","فکر"]

];


/* ==================================
   متغیرهای بازی
================================== */

let cards=[];

let firstCard=null;

let secondCard=null;

let lockBoard=false;

let score=0;

let moves=0;

let matchedPairs=0;

let studentName="";


/* ==================================
   اعداد فارسی
================================== */

const persianDigits=
"۰۱۲۳۴۵۶۷۸۹";


function fa(number){

return String(number).replace(
/[0-9]/g,

function(x){

return persianDigits[x];

}

);

}


/* ==================================
   صدای بازی
================================== */

function playSound(type){

try{

const AudioContext=
window.AudioContext ||
window.webkitAudioContext;

const ctx=
new AudioContext();

const oscillator=
ctx.createOscillator();

const gain=
ctx.createGain();

oscillator.connect(gain);

gain.connect(ctx.destination);


if(type==="tap"){

oscillator.frequency.setValueAtTime(
420,
ctx.currentTime
);

oscillator.frequency.setValueAtTime(
600,
ctx.currentTime+.08
);

}

if(type==="correct"){

oscillator.frequency.setValueAtTime(
600,
ctx.currentTime
);

oscillator.frequency.setValueAtTime(
800,
ctx.currentTime+.12
);

oscillator.frequency.setValueAtTime(
1000,
ctx.currentTime+.24
);

}

if(type==="wrong"){

oscillator.frequency.setValueAtTime(
220,
ctx.currentTime
);

oscillator.frequency.setValueAtTime(
150,
ctx.currentTime+.18
);

}

if(type==="finish"){

oscillator.frequency.setValueAtTime(
523,
ctx.currentTime
);

oscillator.frequency.setValueAtTime(
659,
ctx.currentTime+.12
);

oscillator.frequency.setValueAtTime(
784,
ctx.currentTime+.24
);

oscillator.frequency.setValueAtTime(
1046,
ctx.currentTime+.36
);

}


gain.gain.setValueAtTime(
.001,
ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.20,
ctx.currentTime+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
ctx.currentTime+.65
);


oscillator.start();

oscillator.stop(
ctx.currentTime+.7
);

}catch(e){}

}


/* ==================================
   شروع
================================== */

document
.getElementById("startButton")
.onclick=startGame;


document
.getElementById("nameInput")
.addEventListener(
"keydown",

function(e){

if(e.key==="Enter"){

startGame();

}

}
);


function startGame(){

const input=
document.getElementById("nameInput");

studentName=
input.value.trim();


if(!studentName){

input.focus();

input.placeholder=
"لطفاً نامت را بنویس 🌟";

return;

}


playSound("tap");


document
.getElementById("startScreen")
.style.display="none";


document
.getElementById("game")
.style.display="block";


createPuzzle();

}


/* ==================================
   ساخت پازل
================================== */

function createPuzzle(){

const puzzle=
document.getElementById("puzzle");

puzzle.innerHTML="";


score=0;

moves=0;

matchedPairs=0;

firstCard=null;

secondCard=null;

lockBoard=false;


/*
هر جفت شامل دو کلمه است
در مجموع:

۸ جفت
=
۱۶ کارت
*/

cards=[];


wordPairs.forEach(
function(pair,index){

cards.push({

word:pair[0],

pair:index

});


cards.push({

word:pair[1],

pair:index

});

}
);


/*
کلمات کاملاً نامرتب می‌شوند
*/

shuffle(cards);


cards.forEach(
function(card,index){

const tile=
document.createElement("div");

tile.className="tile";


tile.dataset.index=index;


tile.innerHTML=`

<div class="tile-inner">

<div class="tile-front"></div>

<div class="tile-back">

${card.word}

</div>

</div>

`;


tile.addEventListener(
"click",

function(){

flipCard(
tile,
index
);

}
);


puzzle.appendChild(tile);

}
);


updateInfo();

document
.getElementById("message")
.textContent=
"🌟 اولین قطعه را انتخاب کن!";

}


/* ==================================
   برگرداندن کارت
================================== */

function flipCard(tile,index){

if(lockBoard)
return;


if(tile.classList.contains("flipped"))
return;


if(tile.classList.contains("matched"))
return;


playSound("tap");


tile.classList.add("flipped");


if(!firstCard){

firstCard={

tile:tile,

index:index

};


document
.getElementById("message")
.textContent=
"✨ حالا قطعه دوم را انتخاب کن.";

return;

}


secondCard={

tile:tile,

index:index

};


moves++;

updateInfo();

checkMatch();

}


/* ==================================
   بررسی جفت
================================== */

function checkMatch(){

lockBoard=true;


const first=
cards[firstCard.index];

const second=
cards[secondCard.index];


if(
first.pair === second.pair
){

/* جفت درست */

score+=10;

matchedPairs++;


firstCard.tile
.classList.add("matched");


secondCard.tile
.classList.add("matched");


playSound("correct");


document
.getElementById("message")
.textContent=
"🎉 آفرین! دو کلمه هم‌معنی هستند.";


updateInfo();


resetTurn();


/*
اگر هر ۸ جفت پیدا شدند
بازی تمام می‌شود
*/

if(matchedPairs===8){

setTimeout(
finishGame,
900
);

}

}

else{

/* پاسخ اشتباه */

playSound("wrong");


document
.getElementById("message")
.textContent=
"💙 این دو کلمه هم‌معنی نیستند. دوباره تلاش کن.";


setTimeout(

function(){

firstCard.tile
.classList.remove("flipped");


secondCard.tile
.classList.remove("flipped");


resetTurn();

},

900

);

}

}


/* ==================================
   پایان نوبت
================================== */

function resetTurn(){

firstCard=null;

secondCard=null;


setTimeout(

function(){

lockBoard=false;

},

150

);

}


/* ==================================
   اطلاعات
================================== */

function updateInfo(){

document
.getElementById("score")
.textContent=
fa(score);


document
.getElementById("moves")
.textContent=
fa(moves);

}


/* ==================================
   پایان بازی
================================== */

function finishGame(){

playSound("finish");


document
.getElementById("game")
.style.display="none";


document
.getElementById("endScreen")
.style.display="flex";


document
.getElementById("finalName")
.textContent=
"🌟 "+studentName+" عزیز 🌟";


document
.getElementById("finalScore")
.textContent=
fa(score);


let message;


if(score===80){

message=
"🌈 فوق‌العاده بود!<br>"+
"تمام کلمات هم‌معنی را پیدا کردی! 🏆";

}

else if(score>=60){

message=
"🎉 عالی بود!<br>"+
"کلمات هم‌معنی را خیلی خوب می‌شناسی.";

}

else{

message=
"⭐ آفرین!<br>"+
"یک بار دیگر بازی کن و رکوردت را بهتر کن.";

}


document
.getElementById("finalMessage")
.innerHTML=
message;


/* جشن */

celebrate();

}


/* ==================================
   جشن
================================== */

function celebrate(){

const symbols=[

"⭐",
"🌟",
"✨",
"🌈",
"🎉",
"🧩"

];


for(
let i=0;
i<35;
i++
){

const item=
document.createElement("div");


item.style.position="fixed";

item.style.top="-30px";

item.style.left=
Math.random()*100+
"vw";

item.style.zIndex="200";

item.style.fontSize=
"25px";


item.textContent=
symbols[
Math.floor(
Math.random()*symbols.length
)
];


item.style.transition=
"transform 3s linear";


document.body.appendChild(item);


setTimeout(

function(){

item.style.transform=
"translateY(110vh) rotate(500deg)";

},

50+
Math.random()*1000

);


setTimeout(

function(){

item.remove();

},

4000

);

}

}


/* ==================================
   بازی دوباره
================================== */

function restartGame(){

document
.getElementById("endScreen")
.style.display="none";


document
.getElementById("game")
.style.display="block";


createPuzzle();

}


/* ==================================
   به‌هم‌ریختن کارت‌ها
================================== */

function shuffle(array){

for(
let i=array.length-1;
i>0;
i--
){

const j=
Math.floor(
Math.random()*(i+1)
);


[
array[i],
array[j]
]=
[
array[j],
array[i]
];

}

}

</script>

</body>
</html>
